<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ping · Navigateur</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;color:#e8ecf3;font:13px system-ui,-apple-system,sans-serif}
  .bar{display:flex;gap:6px;align-items:center;padding:8px 12px 8px 84px;border-bottom:1px solid #1f2430;-webkit-app-region:drag;height:36px}
  .bar *{-webkit-app-region:no-drag}
  .os-win32 .bar{padding-left:12px;-webkit-app-region:no-drag}
  button{background:transparent;border:1px solid #1f2430;color:#e8ecf3;border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
  button:hover{border-color:#39ff88;color:#39ff88}
  input{flex:1;background:#12151d;border:1px solid #1f2430;color:#e8ecf3;border-radius:8px;padding:6px 10px;font:inherit}
  input:focus{outline:none;border-color:#39ff88}
  .quick button{font-size:12px;padding:4px 9px}
  webview{width:100%;height:calc(100% - 53px)}
  body.panel webview{height:calc(100% - 107px)}
</style>
</head>
<body>
  <div class="bar">
    <button id="back" title="Précédent">‹</button>
    <button id="fwd" title="Suivant">›</button>
    <button id="reload" title="Recharger">↻</button>
    <input id="url" spellcheck="false">
    <span class="quick">
      <button data-u="https://www.leboncoin.fr">LBC</button>
      <button data-u="https://www.facebook.com/marketplace/">Marketplace</button>
      <button data-u="https://www.vinted.fr">Vinted</button>
      <button data-u="https://www.ebay.fr">eBay</button>
    </span>
    <button id="ext" title="Ouvrir dans ton navigateur">Ouvrir ↗</button>
    <button id="watch" style="background:#39ff88;color:#04120a;border:0;font-weight:700">➕ Surveiller cette page</button>
  </div>
  <div id="panel" hidden style="padding:10px 12px;border-bottom:1px solid #1f2430;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#12151d">
    <span style="color:#8a93a6">Surveiller cette recherche :</span>
    <input id="wName" placeholder="Nom (ex : 208 diesel)" style="flex:0 1 200px">
    <input id="wKw" placeholder="Mots obligatoires (facultatif)" style="flex:0 1 220px">
    <input id="wMax" type="number" placeholder="Prix max (facultatif)" style="flex:0 1 150px">
    <button id="wOk" style="background:#39ff88;color:#04120a;border:0;font-weight:700">Lancer la surveillance</button>
    <button id="wCancel">Annuler</button>
    <span id="wMsg" style="color:#39ff88"></span>
  </div>
  <webview id="wv" partition="persist:ping" allowpopups></webview>
<script>
  const wv = document.getElementById('wv'), url = document.getElementById('url');
  const start = new URLSearchParams(location.search).get('url') || 'https://www.leboncoin.fr';
  wv.src = start; url.value = start;
  const go = (u) => { if (!/^https?:\/\//.test(u)) u = 'https://' + u; wv.loadURL(u); };
  wv.addEventListener('did-navigate', (e) => (url.value = e.url));
  wv.addEventListener('did-navigate-in-page', (e) => (url.value = e.url));
  wv.addEventListener('page-title-updated', (e) => (document.title = 'Ping · ' + e.title));
  url.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(url.value.trim()); });
  document.getElementById('back').onclick = () => wv.canGoBack() && wv.goBack();
  document.getElementById('fwd').onclick = () => wv.canGoForward() && wv.goForward();
  document.getElementById('reload').onclick = () => wv.reload();
  document.getElementById('ext').onclick = () => window.ping.action('openExternal', wv.getURL());
  const panel = document.getElementById('panel');
  document.getElementById('watch').onclick = () => {
    panel.hidden = false; document.body.classList.add('panel');
    document.getElementById('wName').value = (wv.getTitle() || '').split(/[-|–]/)[0].trim().slice(0, 50);
    document.getElementById('wMsg').textContent = '';
  };
  document.getElementById('wCancel').onclick = () => { panel.hidden = true; document.body.classList.remove('panel'); };
  document.getElementById('wOk').onclick = async () => {
    const url = wv.getURL();
    if (!/^https:\/\//.test(url)) return;
    const host = new URL(url).hostname.replace(/^www\./, '');
    const site = /leboncoin\./.test(host) ? 'Leboncoin' : /facebook\./.test(host) ? 'Marketplace' : /vinted\./.test(host) ? 'Vinted' : /ebay\./.test(host) ? 'eBay' : host;
    const name = document.getElementById('wName').value.trim() || site;
    await window.ping.action('addWatches', [{ group: crypto.randomUUID(), name, site, cat: 'tout', url, min: '', max: document.getElementById('wMax').value, include: document.getElementById('wKw').value.trim(), exclude: '', interval: 60, strict: false }]);
    document.getElementById('wMsg').textContent = '✓ Surveillance lancée : retrouve-la dans « Mes recherches ».';
    setTimeout(() => document.getElementById('wCancel').click(), 2500);
  };
  document.querySelectorAll('[data-u]').forEach((b) => (b.onclick = () => go(b.dataset.u)));
</script>
</body>
</html>
