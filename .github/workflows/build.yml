name: Construire Ping (Mac + Windows)
on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: echo "tag=v$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Construire l'appli Mac
        working-directory: mac
        run: |
          echo '{"tag":"${{ needs.version.outputs.tag }}"}' > build-info.json
          npm install --no-audit --no-fund
          npx electron-builder --mac --arm64 --dir --publish never
          codesign --force --deep --sign - dist/mac-arm64/Ping.app
      - name: Tester que Ping démarre sur Mac
        working-directory: mac
        run: |
          dist/mac-arm64/Ping.app/Contents/MacOS/Ping --smoke & pid=$!
          for i in $(seq 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill -0 $pid 2>/dev/null && { kill $pid; echo "Ping ne répond pas"; exit 1; }
          wait $pid; code=$?; cat "${TMPDIR:-/tmp}/ping-smoke.json" || true; exit $code
      - name: Préparer le zip
        run: |
          mkdir -p Ping-Mac
          cp -R mac/dist/mac-arm64/Ping.app Ping-Mac/
          printf '%s\n' '#!/bin/bash' \
            'cd "$(dirname "$0")"' \
            'echo "Installation de Ping..."' \
            'osascript -e '"'"'quit app "Ping"'"'"' 2>/dev/null' \
            'rm -rf "/Applications/Ping.app"' \
            'cp -R "Ping.app" "/Applications/Ping.app" || { echo "Impossible de copier dans Applications."; read -p "Entrée pour fermer"; exit 1; }' \
            'xattr -cr "/Applications/Ping.app"' \
            'codesign --force --deep --sign - "/Applications/Ping.app" >/dev/null 2>&1' \
            'echo "Ping est installé. Lancement..."' \
            'open "/Applications/Ping.app"' > "Ping-Mac/Installer Ping.command"
          chmod +x "Ping-Mac/Installer Ping.command"
          ditto -c -k --sequesterRsrc --keepParent Ping-Mac Ping-Mac.zip
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: Ping-Mac.zip }

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Construire l'installeur Windows
        working-directory: mac
        shell: bash
        run: |
          echo '{"tag":"${{ needs.version.outputs.tag }}"}' > build-info.json
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
      - name: Tester que Ping démarre sur Windows
        working-directory: mac
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\win-unpacked\Ping.exe" -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Ping ne répond pas" }
          Get-Content "$env:TEMP\ping-smoke.json"
          if ($p.ExitCode -ne 0) { throw "Ping a échoué au démarrage (code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: mac/dist/Ping-Windows-Setup.exe }

  release:
    needs: [version, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Ping ${{ needs.version.outputs.tag }}
          body: "Mac : télécharge Ping-Mac.zip, dézippe, puis clic droit sur « Installer Ping.command » > Ouvrir. Windows : lance Ping-Windows-Setup.exe (si Windows affiche un avertissement : Informations complémentaires > Exécuter quand même)."
          files: |
            out/Ping-Mac.zip
            out/Ping-Windows-Setup.exe
          make_latest: true
